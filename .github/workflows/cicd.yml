
# Node.js CI/CD Workflow

name: Node.js CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # Step 1: Backup environment variables
      - name: Backup .env
        run: |
          if [ -f .env ]; then
            mv .env /tmp/env_backup
          fi

      # Step 2: Download latest GitHub code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 3: Restore environment variables
      - name: Restore .env
        run: |
          if [ -f /tmp/env_backup ]; then
            mv /tmp/env_backup .env
          fi

      # Step 4: Setup Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Step 5: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 6: Build application
      - name: Build application
        run: npm run build --if-present

      # Step 7: Restart backend
      - name: Restart backend
        run: pm2 restart backend
